<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Allow access — Send to AgainERP</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body { max-width: 460px; margin: 48px auto; padding: 0 20px; width: auto; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      .actions { display: flex; flex-direction: column; gap: 8px; margin: 18px 0 10px; }
      button { padding: 10px 14px; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>Allow Send to AgainERP to read this shop</h1>
    <p id="why" class="muted">
      The extension needs your OK once before it can open a shop's product page in this browser. Chrome only lets you give
      that OK by clicking a button on this page.
    </p>
    <div class="actions">
      <button id="allow-host" class="primary"></button>
      <button id="allow-all">Allow all websites (recommended — nothing to ask again)</button>
    </div>
    <p id="result" class="small"></p>
    <script src="allow.js"></script>
  </body>
</html>
