# AgainERP-Excellent-v2 — Moharaz admin/API codebase + Excellent data + excellent-web storefront
# Own offset ports (5458/8028/3228/3008) beside excellent (5455/8025/3225/3005) and moharaz (5457/8027/3227/3007).
# Usage: docker compose -f docker-compose.local.yml up -d --build
# Admin: http://localhost:3228 · API: http://127.0.0.1:8028 · Shop: http://localhost:3008 · DB: excellent @ localhost:5458
name: againerp-excellent-v2

services:
  postgres:
    image: postgres:18-alpine
    container_name: againerp-excellent-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: excellent
      POSTGRES_PASSWORD: excellent
      POSTGRES_DB: excellent
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5458:5432"
    volumes:
      - againerp_excellent_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excellent -d excellent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: againerp-excellent-v2-api
    restart: unless-stopped
    ports:
      - "8028:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://excellent:excellent@postgres:5432/excellent
      CORS_ORIGINS: http://localhost:3228,http://127.0.0.1:3228,http://localhost:3008,http://127.0.0.1:3008
      APP_ENV: development
      APP_DEBUG: "true"
      APP_NAME: Excellent ERP API
      API_PORT: "8010"
      WATCHFILES_FORCE_POLLING: "true"
      STOREFRONT_PUBLIC_URL: http://localhost:3008
      STOREFRONT_BASE_URL: http://localhost:3228
    volumes:
      - ./apps/api:/app
      - againerp_excellent_v2_api_uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8010 --reload
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: againerp-excellent-v2-web
    restart: unless-stopped
    ports:
      - "3228:3220"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8028
      NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3008
      STOREFRONT_PROXY_TARGET: http://storefront:3000
      API_PROXY_TARGET: http://api:8010
    volumes:
      - ./apps/web:/app
      - againerp_excellent_v2_web_node_modules:/app/node_modules
      - againerp_excellent_v2_web_next:/app/.next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3220"
    depends_on:
      - api

  storefront:
    image: node:22-alpine
    container_name: againerp-excellent-v2-storefront
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3008:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_PROXY_TARGET: http://api:8010
      API_INTERNAL_URL: http://api:8010
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8028
      NEXT_PUBLIC_ADMIN_ORIGIN: http://localhost:3228
    volumes:
      - ../excellent-web:/app
      - againerp_excellent_v2_storefront_node_modules:/app/node_modules
      - againerp_excellent_v2_storefront_next:/app/.next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - api

volumes:
  againerp_excellent_v2_pgdata:
    name: againerp_excellent_v2_pgdata
  againerp_excellent_v2_api_uploads:
    name: againerp_excellent_v2_api_uploads
  againerp_excellent_v2_web_node_modules:
    name: againerp_excellent_v2_web_node_modules
  againerp_excellent_v2_web_next:
    name: againerp_excellent_v2_web_next
  againerp_excellent_v2_storefront_node_modules:
    name: againerp_excellent_v2_storefront_node_modules
  againerp_excellent_v2_storefront_next:
    name: againerp_excellent_v2_storefront_next
